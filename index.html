<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание — СШ №41 г. Могилёва</title>
     <link rel="icon" href="./favicon-48x48.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="school-badge">📚 2026/2027 учебный год</div>
            <h1>ГУО «Средняя школа №41 г.Могилёва»</h1>
            <div class="subtitle">Расписание учебных занятий</div>
        </header>
        <div class="controls">
            <div class="controls-grid">
                <div class="control-group">
                    <label>Класс</label>
                    <select id="gradeSelect">
                        <option value="">Выберите класс</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Буква</label>
                    <select id="letterSelect">
                        <option value="">Выберите букву</option>
                    </select>
                </div>
                <div class="control-group" id="profileGroup" style="display:none">
                    <label>Профиль/группа</label>
                    <select id="profileSelect"></select>
                </div>
                <div class="control-group" id="dayGroup">
                    <label>День недели</label>
                    <select id="daySelect">
                        <option value="0">Понедельник</option>
                        <option value="1">Вторник</option>
                        <option value="2">Среда</option>
                        <option value="3">Четверг</option>
                        <option value="4">Пятница</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Режим отображения</label>
                    <div class="mode-toggle">
                        <button id="modeDay" class="active">📅 На день</button>
                        <button id="modeWeek">📆 На неделю</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="info-bar">
            <div class="current-time"><span class="dot"></span><span id="currentTime">—</span></div>
            <div id="currentLessonInfo" style="color: var(--text-soft); font-weight: 500;"></div>
        </div>
        <div class="schedule" id="scheduleContainer"></div>
        <footer>Расписание обновляется автоматически • © 2026 СШ №41 г. Могилёва</footer>
    </div>
    <script src="./script.js"></script>
</body>

</html>
