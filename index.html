<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#7c3aed">
    <title>Расписание — СШ №41 г. Могилёва</title>
     <link rel="icon" href="./favicon-48x48.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="container">
<header><div class="school-badge">📚 2026 / 2027 учебный год</div><h1>ГУО «Средняя школа №41 г. Могилёва»</h1><div class="subtitle">Интерактивное расписание учебных занятий</div><a class="school-site-link" href="https://school41mogilev.by/" target="_blank" rel="noopener noreferrer">🌐 На сайт школы ↗</a><button type="button" id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="Переключить тему">🌙 Тёмная тема</button></header>
<section class="controls" aria-label="Настройки расписания"><div class="controls-grid">
<div class="control-group"><label for="gradeSelect">Класс</label><select id="gradeSelect"><option value="">Выберите класс</option></select></div>
<div class="control-group"><label for="letterSelect">Буква</label><select id="letterSelect"><option value="">Выберите букву</option></select></div>
<div class="control-group" id="profileGroup" hidden><label for="profileSelect">Профиль / группа</label><select id="profileSelect"></select></div>
<div class="control-group" id="dayGroup"><label for="daySelect">День недели</label><select id="daySelect"><option value="0">Понедельник</option><option value="1">Вторник</option><option value="2">Среда</option><option value="3">Четверг</option><option value="4">Пятница</option></select></div>
<div class="control-group"><label>Режим отображения</label><div class="mode-toggle"><button type="button" id="modeDay" class="active" aria-pressed="true">📅 На день</button><button type="button" id="modeWeek" aria-pressed="false">📆 На неделю</button></div></div>
</div></section>
<div class="info-bar"><div class="current-time"><span class="live-dot"></span><span id="currentTime">—</span></div><div class="lesson-status" id="currentLessonInfo" aria-live="polite"></div></div>
<main class="schedule" id="scheduleContainer" aria-live="polite"></main>
<footer>Расписание на 2026 / 2027 учебный год · © 2026 СШ №41 г. Могилёва<div class="small-note">Время уроков и предметы отображаются согласно данным, встроенным в приложение.</div></footer>
</div>
    <script src="./script.js"></script>
</body>

</html>
